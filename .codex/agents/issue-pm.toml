# 섬 지뢰찾기 MVP 시스템 설계

## 1. 설계 목표와 범위

- 단일 사용자가 브라우저에서 로컬로 플레이하는 정적 웹 애플리케이션이다.
- 서버, 계정, 원격 저장소, 랭킹, 게임 저장/복원, 난이도 프리셋은 MVP 범위에서 제외한다.
- 5×5부터 40×40까지의 직사각형 보드, 돌 장애물, 지뢰 배치, 첫 클릭 보호, 좌·우클릭, 타이머와 승패 판정을 클라이언트에서 완결한다.
- 최대 1,600칸은 DOM 기반 CSS Grid로 충분히 처리 가능하다. Canvas는 접근성, 개별 칸 이벤트, 컴포넌트 테스트 비용 때문에 사용하지 않는다.
- 게임 규칙은 UI와 분리된 결정론적 TypeScript 도메인 엔진으로 구현한다. 난수 시드와 현재 시각을 외부에서 주입하여 동일 입력의 재현성과 테스트 안정성을 확보한다.

## 2. 기술 스택

| 계층 | 확정 기술/버전 정책 | 선정 근거 | 제외한 대안 |
|---|---|---|---|
| 런타임/패키지 | Node.js 22.12 이상, npm 10 이상, `package-lock.json` 커밋 | Vite 7의 Node 요구 범위를 만족하고 별도 패키지 매니저 설치가 필요 없다. CI와 로컬 설치를 `npm ci`로 고정한다. | pnpm/yarn은 이 규모에서 추가 도구가 되고, Deno/Bun은 팀·CI 호환성 이점이 작다. |
| 언어 | TypeScript 5.9.x, `strict: true` | 셀·게임 상태를 판별 가능한 유니온으로 표현하고 불가능한 상태와 좌표 오류를 조기에 차단한다. | JavaScript는 규칙 엔진의 상태 조합과 계약 드리프트를 컴파일 시점에 잡기 어렵다. |
| UI | React 19.2.x + React DOM 19.2.x | 폼, 보드, 셀, 상태 패널을 작게 분리하고 선언적으로 갱신하기 쉽다. 생태계의 컴포넌트 테스트 지원이 안정적이다. | Vanilla DOM은 번들 크기는 작지만 상태-화면 동기화와 테스트 픽스처가 수동화된다. Next.js는 서버/SSR/라우팅 요구가 없는 단일 화면에 과하다. |
| 빌드 | Vite 7.x, `@vitejs/plugin-react` | 정적 SPA 빌드와 빠른 개발 서버를 최소 설정으로 제공한다. 산출물은 호스팅 중립적인 `dist/`이다. | Webpack은 설정량이 크고, SSR 프레임워크는 요구 범위를 넓힌다. |
| 상태 관리 | React `useReducer` + 기능 전용 `useGame` 훅 | 전역 서버 상태가 없고 게임 하나의 명시적 이벤트 전이가 전부이므로 외부 상태 라이브러리가 필요 없다. | Redux/Zustand는 현 MVP에서 의존성과 추상화만 늘어난다. |
| 스타일 | 일반 CSS, CSS Modules, CSS custom properties | 섬/바다/모래/돌 테마, 셀 상태, 반응형 크기를 런타임 의존성 없이 표현한다. | Tailwind/CSS-in-JS는 작은 단일 화면에 빌드·런타임 복잡성을 추가한다. |
| 단위/컴포넌트 테스트 | Vitest 4.x, jsdom, React Testing Library, `@testing-library/user-event`, `jest-dom` | Vite/TypeScript와 같은 변환 체계를 쓰며 순수 엔진과 사용자 관점 UI 이벤트를 모두 검증할 수 있다. | Jest는 별도 변환 설정 중복이 생긴다. 구현 세부 스냅샷 중심 테스트는 리팩터링 내성이 낮다. |
| E2E | Playwright 1.x | 실제 브라우저의 좌클릭, `contextmenu`, 타이머, 스크롤되는 40×40 보드를 검증한다. CI 기본은 Chromium, 릴리즈 게이트는 Chromium과 WebKit이다. | Cypress보다 멀티 브라우저와 병렬 실행을 기본 도구만으로 구성하기 쉽다. |
| 정적 분석/포맷 | ESLint 9.x flat config, typescript-eslint 8.x, eslint-plugin-react-hooks 6.x, Prettier 3.x | 타입 검사와 별도로 훅 규칙, 접근성에 영향을 주는 실수, 일관된 형식을 검사한다. | 무검사 또는 포맷터 단독은 상태 전이 코드의 결함을 충분히 차단하지 못한다. |
| 배포 | GitHub Actions + GitHub Pages 정적 배포 | 서버와 비밀값 없이 `dist/`만 배포할 수 있고 PR 검증과 배포 이력이 남는다. `dist/` 자체는 Netlify/Cloudflare Pages에도 그대로 이식 가능하다. | 컨테이너/서버 배포는 운영 표면만 늘어난다. |

버전은 위 호환 범위 안의 정확한 버전을 `package-lock.json`으로 고정한다. 주요 버전 업그레이드는 테스트 전체 통과 후 별도 변경으로 수행한다. React Server Components, SSR, PWA/service worker는 사용하지 않는다.

## 3. 디렉터리 구조 및 소유권

```text
/
├─ index.html
├─ package.json
├─ package-lock.json
├─ tsconfig*.json
├─ vite.config.ts
├─ vitest.config.ts
├─ playwright.config.ts
├─ eslint.config.js
├─ .prettierrc.json
├─ public/
├─ src/
│  ├─ main.tsx
│  ├─ app/
│  │  └─ App.tsx
│  ├─ contracts/
│  │  ├─ game.ts
│  │  └─ README.md
│  ├─ features/game/
│  │  ├─ components/       # 설정 폼, 상태 바, 보드, 셀, 종료 안내
│  │  ├─ engine/           # 순수 생성·공개·확산·판정·PRNG 로직
│  │  ├─ state/            # reducer, actions, useGame, selectors
│  │  ├─ config/           # 조정 가능한 기본 게임 규칙
│  │  └─ styles/           # 섬 테마 CSS Modules
│  ├─ shared/              # 범용이 실제로 생긴 경우에만 사용
│  └─ vite-env.d.ts
├─ tests/
│  ├─ unit/                # 엔진/상태 블랙박스 테스트
│  ├─ component/           # 사용자 이벤트 중심 UI 테스트
│  ├─ fixtures/            # 고정 seed, 보드 빌더
│  └─ setup.ts
├─ e2e/
│  └─ game.spec.ts
└─ .github/workflows/
   ├─ ci.yml
   └─ deploy-pages.yml
```

| 역할 | 쓰기 허용 경로 | 명시적 경계 |
|---|---|---|
| `tech-leader` | `src/contracts/**`, `.codex/_workspace/03_contracts/**` | 공개 타입과 불변조건만 정의한다. 게임 구현은 작성하지 않는다. |
| `frontend-qa` | `tests/unit/**`, `tests/component/**`, `tests/fixtures/**`, `tests/setup.ts` | 프로덕션 `src/**`와 E2E를 수정하지 않는다. 필요한 테스트 설정 변경은 오케스트레이터를 통해 DevOps에 요청한다. |
| `frontend-developer` | `src/**` 중 `src/contracts/**` 제외, `index.html`, `public/**` | 계약과 테스트를 수정하지 않는다. 순수 엔진, React 상태, UI와 스타일을 담당한다. |
| `e2e-tester` | `e2e/**` | 프로덕션 코드와 Playwright 전역 설정을 수정하지 않는다. |
| `devops-engineer` | `package.json`, `package-lock.json`, 루트 `*config*`/`.prettier*`, `.github/workflows/**` | 앱·단위 테스트·E2E 시나리오 본문을 수정하지 않는다. GitHub Pages의 base path는 저장소 배포 경로에서 주입 가능하게 만든다. |
| `code-reviewer` | 없음(읽기 전용) | 계약 준수, 규칙 정확성, 보안, 성능과 접근성을 검수한다. |
| `backend-qa`, `backend-developer`, `db-engineer` | 없음 | 서버와 영속 데이터 계층이 없으므로 이 프로젝트에서는 호출하지 않는다. 스키마·마이그레이션·시드도 없다. |
| `tech-writer` | `README.md`, 문서 경로 | 구현 완료 후 실행·배포·규칙 문서를 갱신한다. |

한 파일의 소유자가 겹치지 않게 유지한다. 다른 역할의 소유 파일 변경이 필요하면 직접 수정하지 않고 오케스트레이터가 해당 소유자를 재위임한다.

## 4. 표준 명령어

`package.json` 스크립트는 다음 인터페이스를 정확히 제공한다.

| 목적 | 명령어 | 기대 결과 |
|---|---|---|
| 의존성 설치 | `npm ci` | lockfile과 정확히 일치하는 재현 가능한 설치 |
| 개발 서버 | `npm run dev` | Vite 개발 서버 시작 |
| 포맷 검사 | `npm run format:check` | Prettier 차이가 있으면 실패 |
| 포맷 적용 | `npm run format` | 소유 중인 변경 파일에만 포맷 적용 |
| 린트 | `npm run lint` | ESLint 경고도 실패하도록 `--max-warnings=0` |
| 타입 검사 | `npm run typecheck` | `tsc -b --pretty false`로 emit 없이 검사 |
| FE 단위 테스트 | `npm run test:unit` | Vitest 1회 실행, engine/state 및 component 프로젝트 모두 검사 |
| FE 단위 테스트 감시 | `npm run test:unit:watch` | 로컬 TDD용 Vitest watch |
| 커버리지 | `npm run test:coverage` | v8 커버리지 생성 및 임계값 검사 |
| E2E 설치 | `npx playwright install --with-deps chromium webkit` | CI/신규 환경 브라우저 설치 |
| E2E | `npm run test:e2e` | Playwright가 빌드 미리보기 서버를 자동 기동하고 Chromium/WebKit 실행 |
| 프로덕션 빌드 | `npm run build` | 타입 검사 후 `dist/` 생성 |
| 빌드 미리보기 | `npm run preview` | `dist/` 로컬 정적 서버 실행 |
| 전체 검증 | `npm run check` | `format:check → lint → typecheck → test:unit → build` 순서로 하나라도 실패하면 중단 |

CI PR 게이트는 `npm ci`, `npm run check`, `npm run test:e2e`를 순서대로 실행한다. 배포 워크플로는 기본 브랜치의 동일 게이트가 통과한 커밋만 다시 빌드하여 GitHub Pages에 올린다. 빌드 산출물과 테스트 리포트는 소스 커밋에 포함하지 않는다.

## 5. 계약 산출 형식

계약의 실행 가능한 SSOT는 `src/contracts/game.ts`의 TypeScript 타입과 상수 인터페이스다. 설명형 불변조건과 좌표 예시는 `src/contracts/README.md`에 두며, Phase 2의 결정 기록은 `.codex/_workspace/03_contracts/`에 남긴다.

계약은 최소한 다음 공개 형태를 확정해야 한다.

- `BoardSize { rows: number; columns: number }`, `Coordinate { row: number; column: number }`
- `GameConfig`: 크기 한계, 지뢰 비율 최소/최대, 돌 비율, 돌 덩어리 최대 크기, 첫 클릭 인접 보호 수 1~8의 가중치
- `Cell`: `terrain: 'ground' | 'rock'`, 지뢰 여부, `visibility: 'hidden' | 'revealed'`, 깃발 여부, 인접 지뢰 수. 돌에서는 지뢰·깃발·공개 상태 조합이 생기지 않도록 판별 유니온을 우선한다.
- `GameStatus = 'ready' | 'running' | 'won' | 'lost'`
- `GameState`: 크기, 행 우선 1차원 셀 배열, 상태, 지뢰 배치 여부, 총 지뢰 수, 열린 안전 칸 수, PRNG 상태, 타이머 시작/종료 시각
- `GameAction`: 새 게임, 땅 공개, 깃발 토글, 표시 시간 갱신. 좌표와 현재 시각은 명시적인 payload다.
- `GameViewModel`: UI가 필요한 공개 정보만 제공하며, 진행 중에는 숨은 칸의 지뢰 여부를 컴포넌트에 노출하지 않는다.

기본 설정은 다음으로 고정하되 한 파일에서 조정 가능해야 한다.

```ts
const DEFAULT_GAME_CONFIG = {
  minRows: 5,
  maxRows: 40,
  minColumns: 5,
  maxColumns: 40,
  mineRatio: { min: 0.13, max: 0.17 },
  rockRatio: 0.08,
  maxRockClusterSize: 4,
  adjacentProtectionWeights: [5, 10, 15, 20, 20, 15, 10, 5],
} as const;
```

가중치 배열의 인덱스 0~7은 보호할 인접 칸 수 1~8을 뜻하며 합계는 100이다. 가중치가 양의 정수이고 합계가 100인지 계약 테스트로 검증한다. 조정된 설정도 크기와 비율의 유효 범위를 통과하지 못하면 새 게임을 만들지 않고 명시적인 도메인 오류를 반환한다.

계약 검증은 다음 세 겹으로 수행한다.

1. `npm run typecheck`: 구현과 테스트가 공개 타입에서 벗어나면 실패한다.
2. `tests/unit/contracts.test.ts`: 기본값, 판별 유니온 불변조건, 상태별 허용 액션을 검증한다.
3. `npm run test:e2e`: DOM 계약은 역할 기반 쿼리와 안정적인 `data-testid`만 필요한 곳에 사용해 검증한다. CSS 클래스와 내부 배열 인덱스는 계약으로 삼지 않는다.

## 6. 아키텍처 규약

### 6.1 계층과 의존 방향

```text
React components → useGame/state/selectors → pure game engine → contracts
                        ↑                        ↑
                 clock adapter            seeded PRNG state
```

- `engine`은 React, DOM, 타이머 API, CSS를 import하지 않는다.
- 컴포넌트는 보드 배열을 직접 변경하지 않고 action만 보낸다. 모든 규칙 변경은 엔진의 단일 전이 함수를 통과한다.
- selectors가 숨은 지뢰 정보를 제거한 뷰 모델을 만든다. 셀 컴포넌트가 내부 상태를 읽어 지뢰를 미리 표시하는 구조를 금지한다.
- 서버 통신과 트랜잭션은 없다. 하나의 reducer action 처리가 원자적 상태 전이 경계다.
- 로그 수집 SDK는 넣지 않는다. 개발 모드 진단은 민감 정보가 없는 오류만 `console.error`로 남기고 정상 클릭/보드 전체 상태는 기록하지 않는다.

### 6.2 난수와 재현성

- 브라우저 어댑터는 새 게임마다 `crypto.getRandomValues`로 32비트 seed를 하나 생성한다.
- 엔진은 seed와 함께 저장되는 작은 결정론적 PRNG를 사용하고, 모든 난수 소비 후 다음 PRNG 상태를 `GameState`에 반환한다. 테스트는 고정 seed를 넣는다.
- 돌은 새 게임 생성 시 먼저 배치한다. 목표 수는 `Math.round(rows * columns * rockRatio)`이다. 덩어리 크기를 1~4에서 무작위 선택하고, 시작 칸에서 상하좌우로 연결된 빈 칸을 성장시킨다. 겹침 없이 목표 수까지 반복하며, 제한된 재시도 후 남은 수는 무작위 빈 칸에 단독 돌로 채운다. 따라서 각 생성 단위는 1~4칸이고 돌 총수는 일관된다.
- 지뢰는 첫 번째 유효한 좌클릭 시점까지 배치하지 않는다. 지뢰 비율은 `[0.13, 0.17]` 닫힌 구간의 균등 난수로 정하고, 지뢰 수는 `Math.floor(돌을 제외한 플레이 가능 칸 수 × 선택 비율)`로 계산한다.
- 첫 클릭 칸은 항상 보호한다. 보호 수 1~8을 기본 가중치로 하나 뽑은 뒤, 실제 존재하는 인접 플레이 가능 칸에서 그 수만큼 균등·비복원 추출한다. 가장자리나 돌 때문에 후보가 부족하면 후보 전부만 보호한다.
- 지뢰 후보는 돌, 첫 클릭 칸, 선택된 보호 칸을 제외한 모든 칸이며 균등·비복원 추출한다. 설정 검증은 요청 지뢰 수가 후보 수를 넘는 구성을 거부한다.

### 6.3 게임 규칙과 상태 전이

- 인접은 고전 지뢰찾기와 같이 최대 8방향이다. 숫자는 인접한 지뢰만 세며 돌은 0으로 취급한다.
- `ready`에서 유효한 첫 땅 공개만 지뢰 배치와 타이머 시작을 발생시킨다. 돌 클릭, 깃발 토글, 깃발이 있는 칸 좌클릭은 시작 조건이 아니다.
- 빈칸 확산은 큐 기반 BFS로 구현해 재귀 깊이 문제를 피한다. 돌, 지뢰, 깃발 칸은 큐에 넣지 않는다. 연결된 0칸과 그 경계의 숫자 칸만 열고, 돌을 열거나 통과시키지 않는다.
- 숨은 지뢰 좌클릭은 즉시 `lost`로 바꾸고 타이머 종료 시각을 고정한다. 모든 안전한 비돌 칸이 열리면 깃발의 정확성과 무관하게 `won`으로 바꾸고 종료 시각을 고정한다.
- `won`/`lost`에서는 공개와 깃발 action이 no-op이다. 새 게임 action만 상태를 초기화한다.
- 우클릭은 셀 수준 `contextmenu`에서 `preventDefault()` 후 숨은 플레이 가능 칸의 깃발만 토글한다. 돌과 열린 칸은 no-op이다.
- 모든 보드 연산은 최대 `O(rows × columns)`이며 1,600칸에서 가상화하지 않는다. 좌표를 1차원 인덱스로 변환하는 공통 함수로 경계 검사를 통일한다.

### 6.4 타이머

- 상태에는 누적 interval 횟수가 아니라 `startedAtMs`와 `endedAtMs`를 보관한다. 표시 초는 `floor((기준시각 - startedAtMs) / 1000)`이며 시작 직후 0이다.
- UI의 interval은 약 250ms마다 현재 시각 action을 보내 표시만 갱신한다. 브라우저 탭이 백그라운드에서 throttle되어도 벽시계 차이로 정확한 초를 복구한다.
- 새 게임 전과 첫 유효 클릭 전은 항상 0초, 승패 결정 후에는 종료 시각으로 고정한다. 훅 unmount와 새 게임 시 interval을 반드시 정리한다.

### 6.5 UI, 접근성, 섬 테마

- 화면 상단에는 행/열 숫자 입력, 새 게임 버튼, 타이머, 현재 상태를 둔다. 각 입력은 5~40의 정수만 허용하고 폼 제출 시 도메인 검증 결과를 텍스트로 안내한다.
- 보드는 CSS Grid이며 `grid-template-columns: repeat(columns, var(--cell-size))`를 사용한다. 40×40은 보드 컨테이너 내부에서 양방향 스크롤하고 페이지 전체 레이아웃을 깨지 않는다.
- 각 칸은 실제 `<button type="button">`으로 렌더링한다. 돌은 비활성 표현을 쓰되 이벤트 규칙 검증을 위해 단순히 DOM에서 제거하지 않는다. `aria-label`에는 좌표와 사용자에게 보이는 상태만 포함한다.
- 바다 배경, 모래/풀 닫힌 칸, 파낸 모래, 입체 돌, 깃발, 폭발 상태를 색상뿐 아니라 모양·텍스트/아이콘 차이로도 구분한다. 숫자는 1~8별 색을 보조적으로 사용하되 명암 대비를 유지한다.
- 핵심 조작은 데스크톱 좌/우클릭이다. 모바일 장기 누르기 같은 별도 조작은 MVP 계약에 추가하지 않는다.
- 승패 메시지는 `aria-live="polite"`, 입력 오류는 연결된 설명 영역으로 제공한다. `prefers-reduced-motion`에서는 파도·승패 애니메이션을 제거한다.

### 6.6 클라이언트 상태와 오류 처리

- 현재 게임은 메모리에만 둔다. 새로고침 시 초기 설정 화면으로 돌아가며 localStorage, URL 직렬화, 원격 동기화는 하지 않는다.
- 폼 입력 오류는 새 상태를 만들지 않고 현재 게임을 유지한 채 사용자에게 범위를 안내한다.
- 내부 불변조건 위반은 개발 환경에서 빠르게 실패시키고, UI 경계에서는 일반적인 재시작 안내를 보여준다. 오류 후 손상된 게임을 계속 진행하지 않는다.
- 외부 API와 실시간 통신은 없다. WebSocket, polling, 서비스 워커를 추가하지 않는다.

## 7. 도메인 모델 경계와 데이터 흐름

### 7.1 핵심 모델

- `GameConfig`: 조정 가능한 생성 규칙. 배포 시 코드 기본값이며 사용자 난이도 UI로 노출하지 않는다.
- `GameState`: 단일 게임 aggregate root. 보드, 라이프사이클, PRNG, 타이머를 함께 소유한다.
- `GroundCell`과 `RockCell`: 좌표에 위치한 셀의 판별 유니온. 돌은 열림/깃발/지뢰/숫자 상태를 갖지 않는다.
- `Coordinate`: 행·열 0 기반 내부 좌표. UI 라벨은 1 기반으로 변환한다.
- 별도 엔티티 저장소나 관계형 데이터 모델은 없다. 모든 관계는 `GameState` 안의 보드 인덱스와 인접 좌표 계산으로 끝난다.

### 7.2 데이터 흐름

```text
사용자 행/열 입력
  → 설정 검증
  → crypto seed 생성
  → 순수 엔진이 돌 보드와 ready 상태 생성
  → reducer 저장
  → selector가 안전한 view model 생성
  → React가 섬 보드 렌더링

첫 유효 좌클릭
  → 보호 수/보호 칸/지뢰를 PRNG로 결정
  → 인접 지뢰 수 계산 및 공개/BFS
  → 승패 및 타이머 원자적 갱신
  → view model 재계산
  → React 갱신
```

수집·저장·조회 서버 단계는 없다. 입력은 브라우저 이벤트로 수집되고 메모리에서 처리·보관되며 selector를 통해 화면에서 조회된다.

## 8. 테스트 전략

### 8.1 단위 테스트

- 최소/최대 및 비정사각형 크기, 잘못된 정수 입력을 검증한다.
- 다수의 고정 seed와 경계 크기로 돌 총수, 돌 덩어리 최대 크기, 중복 없음, 지뢰와 돌 비중첩을 검증한다.
- 첫 클릭과 선택된 보호 칸의 안전, 보호 후보 부족 처리, 13~17% 지뢰 비율과 일관된 내림 규칙을 검증한다.
- 확률 가중치는 난수 경계값을 직접 주입해 1~8 모든 구간 매핑을 검증한다. 통계적 flaky 테스트를 CI 게이트로 쓰지 않는다.
- 돌이 숫자에 포함되지 않는지, 확산이 돌·깃발·지뢰를 열지 않는지, 가장자리/모서리 인접 계산을 검증한다.
- 승패 후 no-op, 잘못된 좌표, 새 게임 초기화, 즉시 승리 시 0초 정지를 검증한다.
- fake timer와 명시적 `nowMs`로 0초 시작, 1초 증가, 백그라운드 지연 복구, 종료 고정을 검증한다.
- engine/state의 statements/branches/functions/lines 커버리지 기준은 각 90% 이상, UI 포함 전체는 각 80% 이상으로 둔다. 수치 달성보다 핵심 불변조건 시나리오를 우선한다.

### 8.2 컴포넌트 테스트

- 유효/무효 폼 제출, 비정사각형 Grid 렌더링, 새 게임 초기화를 사용자 관점으로 검증한다.
- 좌클릭 공개, 우클릭 기본 메뉴 방지와 깃발 토글, 깃발 좌클릭 차단, 돌 양쪽 클릭 no-op를 검증한다.
- timer와 상태 텍스트, 승패 후 입력 차단, `aria-live`, 접근 가능한 이름을 검증한다.
- 구현 클래스명이나 내부 reducer 호출 횟수는 assertion 대상으로 삼지 않는다.

### 8.3 E2E

- 5×7과 40×20 보드 생성, 입력 거부, 스크롤 가능한 레이아웃을 실제 브라우저에서 검증한다.
- 고정 seed를 E2E 전용 빌드/URL에서만 주입할 수 있는 테스트 어댑터를 두되 프로덕션 UI에는 노출하지 않는다.
- 첫 클릭 0초, 시간이 흐른 뒤 증가, 패배/승리 시 정지, 새 게임 0초 초기화를 검증한다.
- `click`과 `contextmenu`를 실제 이벤트로 실행하고 종료 후 상호작용 차단을 확인한다.
- 시각 회귀는 대표 데스크톱 뷰포트 한 장과 작은 뷰포트 한 장만 사용하며, 규칙 정확성은 DOM assertion으로 검증한다.

## 9. 관측성·보안·배포 제약

- 외부 입력은 행/열뿐이며 숫자로 파싱한 뒤 정수와 5~40 경계를 모두 검사한다. 사용자 문자열을 `innerHTML`로 삽입하지 않는다.
- 서드파티 분석, 광고, 원격 폰트, 사용자 추적을 넣지 않는다. Content Security Policy는 정적 자기 호스팅 자산만 허용하는 방향으로 배포 헤더 또는 HTML meta에서 설정한다.
- 난수는 공정성 체감과 재현 가능한 디버깅 목적이며 보안 토큰이 아니다. 초기 seed만 Web Crypto로 만들고 seed를 개인정보와 결합하지 않는다.
- CI는 최소 권한을 사용한다. PR 검증은 읽기 권한, Pages 배포 job만 `pages: write`와 `id-token: write`를 갖는다. 비밀값은 필요 없다.
- 애플리케이션 로그 백엔드는 없다. CI 빌드/테스트 결과, Playwright trace(실패 시에만), 정적 배포 이력이 운영 관측성이다.
- `dist/`는 불변 정적 파일로 배포한다. SPA 라우팅이 없으므로 별도의 rewrite 규칙은 필요 없다. 캐시는 해시 자산은 장기, `index.html`은 짧게 설정한다.
- 가용성은 정적 호스팅 SLA를 따른다. 무중단 서버 배포나 DB 백업은 적용 대상이 아니다.

## 10. 미결 사항과 후속 조정 지점

- 사용자가 플레이 후 돌 비율과 덩어리 크기를 조정할 예정이므로 `DEFAULT_GAME_CONFIG`만 변경해 실험할 수 있어야 한다. 알고리즘 계약과 UI를 함께 바꾸지 않는다.
- 첫 클릭 보호의 기본 가중치는 `[5, 10, 15, 20, 20, 15, 10, 5]`로 제안한다. 실제 플레이 피드백에 따라 배열 값만 조정한다.
- 섬 테마의 최종 색상·아이콘 세부는 구현 시 WCAG AA 대비와 셀 가독성 검증을 거쳐 확정한다. 외부 이미지가 꼭 필요하지 않으므로 MVP는 CSS와 간단한 인라인 SVG/문자 아이콘을 우선한다.
- GitHub 저장소 이름과 Pages URL은 배포 시점에 확정해 Vite `base` 값에 반영한다. 게임 규칙 및 계약에는 영향이 없다.
</design_spec>

